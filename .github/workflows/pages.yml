name: Website (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  # Refreshes the download count behind the README badge (site/downloads.json).
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site/
    # The hourly refresh only in the public repository.
    if: github.event_name != 'schedule' || github.repository == 'FortoGraphy/prism-download-manager'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Drop build-only files
        run: rm -rf site/tools
      - name: Download count for the README badge
        # Downloads of every release asset (as the shields.io GitHub badge counted them), served as
        # a shields.io endpoint, so the badge needs no GitHub API token. When the API call fails,
        # the published count stays.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[].assets[].download_count] | add // 0' \
            | awk '{ s += $1 } END { print s + 0 }') || total=0
          if [ "${total:-0}" -gt 0 ]; then
            message=$(awk -v n="$total" 'BEGIN {
              if (n < 1000) { printf "%d", n }
              else if (n < 10000) { s = sprintf("%.1f", n / 1000); sub(/\.0$/, "", s); printf "%sk", s }
              else if (n < 1000000) { printf "%dk", int(n / 1000) }
              else { s = sprintf("%.1f", n / 1000000); sub(/\.0$/, "", s); printf "%sM", s }
            }')
            printf '{"schemaVersion":1,"label":"downloads","message":"%s","color":"3fb8ff","cacheSeconds":300}\n' "$message" > site/downloads.json
          else
            curl -fsS https://prismdl.site/downloads.json -o site/downloads.json || true
          fi
          cat site/downloads.json || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
